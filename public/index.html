<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système de Vente de Tickets</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: white;
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .tab {
            padding: 15px 30px;
            border: none;
            background: transparent;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            color: #666;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .event-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            border: 1px solid #e1e5e9;
        }

        .event-card:hover {
            transform: translateY(-5px);
        }

        .event-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .event-info {
            margin-bottom: 15px;
            color: #666;
        }

        .event-info i {
            margin-right: 8px;
            color: #667eea;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 20px;
        }

        .ticket-form {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .qr-code {
            text-align: center;
            margin: 20px 0;
        }

        .qr-code img {
            max-width: 200px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .scanner-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .scanner-input {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .scanner-input input {
            flex: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .tabs {
                flex-direction: column;
                border-radius: 15px;
            }
            
            .scanner-input {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-ticket-alt"></i> Système de Vente de Tickets</h1>
            <p>Gérez vos événements et vendez des tickets en ligne</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('events')">
                <i class="fas fa-calendar"></i> Événements
            </button>
            <button class="tab" onclick="showTab('create-event')">
                <i class="fas fa-plus"></i> Créer un événement
            </button>
            <button class="tab" onclick="showTab('scanner')">
                <i class="fas fa-qrcode"></i> Scanner
            </button>
        </div>

        <!-- Onglet Événements -->
        <div id="events" class="tab-content active">
            <h2><i class="fas fa-calendar-alt"></i> Événements disponibles</h2>
            <div id="events-list" class="events-grid">
                <p>Chargement des événements...</p>
            </div>
        </div>

        <!-- Onglet Créer un événement -->
        <div id="create-event" class="tab-content">
            <h2><i class="fas fa-plus-circle"></i> Créer un nouvel événement</h2>
            <form id="create-event-form">
                <div class="form-group">
                    <label for="event-name">Nom de l'événement *</label>
                    <input type="text" id="event-name" required>
                </div>
                <div class="form-group">
                    <label for="event-description">Description</label>
                    <textarea id="event-description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="event-date">Date et heure *</label>
                    <input type="datetime-local" id="event-date" required>
                </div>
                <div class="form-group">
                    <label for="event-location">Lieu</label>
                    <input type="text" id="event-location">
                </div>
                <div class="form-group">
                    <label for="event-price">Prix du ticket (€) *</label>
                    <input type="number" id="event-price" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="event-max-tickets">Nombre maximum de tickets</label>
                    <input type="number" id="event-max-tickets" min="1">
                </div>
                <button type="submit" class="btn">
                    <i class="fas fa-save"></i> Créer l'événement
                </button>
            </form>
        </div>

        <!-- Onglet Scanner -->
        <div id="scanner" class="tab-content">
            <h2><i class="fas fa-qrcode"></i> Scanner de tickets</h2>
            
            <div class="scanner-section">
                <h3>Connexion scanner</h3>
                <form id="scanner-login-form">
                    <div class="form-group">
                        <label for="scanner-username">Nom d'utilisateur</label>
                        <input type="text" id="scanner-username" value="scanner" required>
                    </div>
                    <div class="form-group">
                        <label for="scanner-password">Mot de passe</label>
                        <input type="password" id="scanner-password" value="scanner123" required>
                    </div>
                    <button type="submit" class="btn">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                </form>
            </div>

            <div id="scanner-interface" style="display: none;">
                <div class="scanner-section">
                    <h3>Scanner un ticket</h3>
                    <div class="scanner-input">
                        <input type="text" id="ticket-code-input" placeholder="Entrez le code du ticket ou scannez le QR code">
                        <button class="btn" onclick="validateTicket()">
                            <i class="fas fa-check"></i> Valider
                        </button>
                    </div>
                    <div id="scanner-result"></div>
                </div>

                <div class="scanner-section">
                    <h3>Statistiques des événements</h3>
                    <div id="events-stats" class="stats-grid">
                        <p>Chargement des statistiques...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let events = [];

        // Gestion des onglets
        function showTab(tabName) {
            // Masquer tous les contenus
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Désactiver tous les onglets
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Activer l'onglet sélectionné
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            // Charger les données appropriées
            if (tabName === 'events') {
                loadEvents();
            } else if (tabName === 'scanner') {
                loadEventsStats();
            }
        }

        // Charger les événements
        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                events = await response.json();
                displayEvents();
            } catch (error) {
                console.error('Erreur lors du chargement des événements:', error);
            }
        }

        // Afficher les événements
        function displayEvents() {
            const eventsList = document.getElementById('events-list');
            
            if (events.length === 0) {
                eventsList.innerHTML = '<p>Aucun événement disponible pour le moment.</p>';
                return;
            }

            eventsList.innerHTML = events.map(event => `
                <div class="event-card">
                    <h3>${event.name}</h3>
                    <div class="event-info">
                        <i class="fas fa-calendar"></i> ${new Date(event.date).toLocaleString('fr-FR')}
                    </div>
                    ${event.location ? `<div class="event-info"><i class="fas fa-map-marker-alt"></i> ${event.location}</div>` : ''}
                    ${event.description ? `<div class="event-info"><i class="fas fa-info-circle"></i> ${event.description}</div>` : ''}
                    <div class="price">${event.price}€</div>
                    
                    <div class="ticket-form">
                        <h4>Acheter un ticket</h4>
                        <form onsubmit="purchaseTicket(event, event)">
                            <div class="form-group">
                                <input type="text" placeholder="Votre nom" required>
                            </div>
                            <div class="form-group">
                                <input type="email" placeholder="Votre email" required>
                            </div>
                            <button type="submit" class="btn">
                                <i class="fas fa-shopping-cart"></i> Acheter
                            </button>
                        </form>
                    </div>
                </div>
            `).join('');
        }

        // Créer un événement
        document.getElementById('create-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('event-name').value,
                description: document.getElementById('event-description').value,
                date: document.getElementById('event-date').value,
                location: document.getElementById('event-location').value,
                price: parseFloat(document.getElementById('event-price').value),
                max_tickets: document.getElementById('event-max-tickets').value ? parseInt(document.getElementById('event-max-tickets').value) : null
            };

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert('Événement créé avec succès !');
                    document.getElementById('create-event-form').reset();
                    loadEvents();
                } else {
                    const error = await response.json();
                    alert('Erreur: ' + error.error);
                }
            } catch (error) {
                alert('Erreur lors de la création de l\'événement');
            }
        });

        // Acheter un ticket
        async function purchaseTicket(event, eventData) {
            event.preventDefault();
            
            const form = event.target;
            const customerName = form.querySelector('input[type="text"]').value;
            const customerEmail = form.querySelector('input[type="email"]').value;

            try {
                const response = await fetch('/api/tickets/purchase', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_id: eventData.id,
                        customer_name: customerName,
                        customer_email: customerEmail
                    })
                });

                if (response.ok) {
                    const ticket = await response.json();
                    showTicketSuccess(ticket);
                } else {
                    const error = await response.json();
                    alert('Erreur: ' + error.error);
                }
            } catch (error) {
                alert('Erreur lors de l\'achat du ticket');
            }
        }

        // Afficher le ticket acheté
        function showTicketSuccess(ticket) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            `;
            
            modal.innerHTML = `
                <div style="background: white; padding: 30px; border-radius: 20px; max-width: 500px; text-align: center;">
                    <h2 style="color: #28a745; margin-bottom: 20px;">
                        <i class="fas fa-check-circle"></i> Ticket acheté !
                    </h2>
                    <div class="qr-code">
                        <img src="${ticket.qr_code}" alt="QR Code du ticket">
                    </div>
                    <p><strong>Événement:</strong> ${ticket.event.name}</p>
                    <p><strong>Nom:</strong> ${ticket.customer.name}</p>
                    <p><strong>Code:</strong> ${ticket.ticket_code}</p>
                    <button class="btn" onclick="this.parentElement.parentElement.remove()">
                        Fermer
                    </button>
                </div>
            `;
            
            document.body.appendChild(modal);
        }

        // Connexion scanner
        document.getElementById('scanner-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('scanner-username').value;
            const password = document.getElementById('scanner-password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    document.getElementById('scanner-interface').style.display = 'block';
                    document.getElementById('scanner-login-form').style.display = 'none';
                    loadEventsStats();
                } else {
                    const error = await response.json();
                    alert('Erreur de connexion: ' + error.error);
                }
            } catch (error) {
                alert('Erreur lors de la connexion');
            }
        });

        // Valider un ticket
        async function validateTicket() {
            const ticketCode = document.getElementById('ticket-code-input').value.trim();
            
            if (!ticketCode) {
                alert('Veuillez entrer un code de ticket');
                return;
            }

            try {
                const response = await fetch('/api/tickets/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ticket_code: ticketCode,
                        scanner_username: currentUser.username
                    })
                });

                const result = await response.json();
                const resultDiv = document.getElementById('scanner-result');
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success-message">
                            <h4><i class="fas fa-check-circle"></i> Ticket validé !</h4>
                            <p><strong>Événement:</strong> ${result.ticket.event_name}</p>
                            <p><strong>Client:</strong> ${result.ticket.customer_name}</p>
                            <p><strong>Date:</strong> ${new Date(result.ticket.event_date).toLocaleDateString('fr-FR')}</p>
                            <p><strong>Scanné par:</strong> ${result.ticket.scanned_by}</p>
                            <p><strong>Heure:</strong> ${new Date(result.ticket.scanned_at).toLocaleTimeString('fr-FR')}</p>
                        </div>
                    `;
                    document.getElementById('ticket-code-input').value = '';
                    loadEventsStats();
                } else {
                    resultDiv.innerHTML = `
                        <div class="error-message">
                            <h4><i class="fas fa-exclamation-triangle"></i> Erreur de validation</h4>
                            <p>${result.error}</p>
                            ${result.scanned_at ? `<p>Ticket déjà scanné le ${new Date(result.scanned_at).toLocaleString('fr-FR')}</p>` : ''}
                        </div>
                    `;
                }
            } catch (error) {
                alert('Erreur lors de la validation du ticket');
            }
        }

        // Charger les statistiques des événements
        async function loadEventsStats() {
            if (!currentUser) return;
            
            try {
                const statsContainer = document.getElementById('events-stats');
                let statsHTML = '';
                
                for (const event of events) {
                    const response = await fetch(`/api/events/${event.id}/stats`);
                    const stats = await response.json();
                    
                    statsHTML += `
                        <div class="stat-card">
                            <div class="stat-number">${event.name}</div>
                            <div class="stat-label">Total: ${stats.total_tickets}</div>
                            <div class="stat-label">Valides: ${stats.valid_tickets}</div>
                            <div class="stat-label">Scannés: ${stats.scanned_tickets}</div>
                        </div>
                    `;
                }
                
                statsContainer.innerHTML = statsHTML;
            } catch (error) {
                console.error('Erreur lors du chargement des statistiques:', error);
            }
        }

        // Charger les événements au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();
        });

        // Permettre la validation avec la touche Entrée
        document.getElementById('ticket-code-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                validateTicket();
            }
        });
    </script>
</body>
</html>
